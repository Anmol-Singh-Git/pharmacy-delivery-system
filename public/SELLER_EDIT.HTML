<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Seller Profile | meddeliver</title>
    <link rel="stylesheet" href="/SELLER_EDIT.CSS">
    <link rel="stylesheet" href="/logo-styles.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>

<div id="navbar"></div>

<main class="seller-edit-container">
    <div class="edit-card">
        <div class="edit-header">
            <h1>Edit Profile</h1>
            <p>Update your pharmacy details, bio, and contact information.</p>
        </div>
        
        <form id="sellerEditForm" class="edit-form">
            <div class="form-section">
                <h2>Basic Information</h2>
                <div class="form-group">
                    <label for="shopName">Shop Name / Pharmacy Name *</label>
                    <input type="text" id="shopName" name="shopName" required>
                </div>
                
                <div class="form-group">
                    <label for="owner_name">Owner Name *</label>
                    <input type="text" id="owner_name" name="owner_name" required>
                </div>
                
                <div class="form-group full-width">
                    <label for="bio">Bio Description</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Tell customers about your pharmacy, specialties, or history..." maxlength="1000"></textarea>
                    <div class="form-hint">Maximum 1000 characters.</div>
                </div>
                
                <div class="form-group full-width">
                    <label for="shop_image">Shop Banner Image URL</label>
                    <input type="url" id="shop_image" name="shop_image" placeholder="https://example.com/image.jpg">
                    <div class="form-hint">Provide a direct link to an image.</div>
                </div>
            </div>
            
            <div class="form-section">
                <h2>Contact & Legal</h2>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required readonly class="readonly-input">
                    <div class="form-hint">Email cannot be changed directly.</div>
                </div>
                
                <div class="form-group">
                    <label for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" name="mobile" required>
                </div>
                
                <div class="form-group">
                    <label for="gstin">GSTIN *</label>
                    <input type="text" id="gstin" name="gstin" required>
                </div>
            </div>
            
            <div class="form-section">
                <h2>Location</h2>
                <div class="form-group full-width">
                    <label for="address">Full Address *</label>
                    <input type="text" id="address" name="address" required>
                </div>
                
                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required>
                </div>
                
                <div class="form-group">
                    <label for="pincode">Pincode *</label>
                    <input type="text" id="pincode" name="pincode" required>
                </div>
            </div>
            
            <div id="formMessage" class="form-message hidden"></div>
            
            <div class="form-actions">
                <button type="submit" class="submit-btn" id="submitBtn">Save Changes</button>
            </div>
        </form>
    </div>
</main>

<script src="/api.js"></script>
<script>
    const BASE_URL = window.API_BASE;
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    const userEmail = localStorage.getItem("seller_email") || localStorage.getItem("email");

    function loadNavbar(){
      try {
        if(window.renderGlobalNavbar) {
            window.renderGlobalNavbar('dashboard');
        }
      } catch (err) {
        console.error("Failed to load standard navbar:", err);
      }
    }
    
    function showMessage(message, type) {
        const msgDiv = document.getElementById("formMessage");
        msgDiv.textContent = message;
        msgDiv.className = `form-message ${type}`;
        msgDiv.classList.remove("hidden");
    }

    async function loadCurrentProfile() {
        if (!token || (role !== "seller" && role !== "admin")) {
            alert("Unauthorized: Please log in as a seller to access this page.");
            window.location.href = "LOGINPAGE.HTML";
            return;
        }

        if (!userEmail) {
            showMessage("Unable to determine seller email. Please log in again.", "error");
            return;
        }

        try {
            const response = await window.fetchJson(`${BASE_URL}/api/seller-profile/${encodeURIComponent(userEmail)}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            
            if (response && response.success && response.profile) {
                const profile = response.profile;
                document.getElementById("shopName").value = profile.shopName || profile.pharmacy_name || "";
                document.getElementById("owner_name").value = profile.owner_name || "";
                document.getElementById("bio").value = profile.bio || "";
                document.getElementById("shop_image").value = profile.shop_image || "";
                document.getElementById("email").value = profile.email || "";
                document.getElementById("mobile").value = profile.mobile || "";
                document.getElementById("gstin").value = profile.gstin || "";
                document.getElementById("address").value = profile.address || "";
                document.getElementById("city").value = profile.city || "";
                document.getElementById("pincode").value = profile.pincode || "";
            } else {
                showMessage("Failed to load profile data.", "error");
            }
        } catch (error) {
            console.error("Error loading profile:", error);
            showMessage("Error loading profile data. Please check your connection.", "error");
        }
    }

    document.getElementById("sellerEditForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Saving...";
        document.getElementById("formMessage").classList.add("hidden");
        
        const formData = {
            shopName: document.getElementById("shopName").value,
            pharmacy_name: document.getElementById("shopName").value,
            owner_name: document.getElementById("owner_name").value,
            bio: document.getElementById("bio").value,
            shop_image: document.getElementById("shop_image").value,
            email: document.getElementById("email").value,
            mobile: document.getElementById("mobile").value,
            gstin: document.getElementById("gstin").value,
            address: document.getElementById("address").value,
            city: document.getElementById("city").value,
            pincode: document.getElementById("pincode").value
        };

        try {
            const response = await fetch(`${BASE_URL}/api/seller/profile`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(formData)
            });
            
            const result = await response.json();
            
            if (response.ok && result.success) {
                showMessage("Profile updated successfully!", "success");
            } else {
                showMessage(result.message || "Failed to update profile.", "error");
            }
        } catch (error) {
            console.error("Update error:", error);
            showMessage("Network error while saving profile.", "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Save Changes";
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar();
        loadCurrentProfile();
    });
</script>
</body>
</html>
