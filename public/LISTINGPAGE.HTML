function storeProduct(medicine){
localStorage.setItem("selectedProduct", JSON.stringify(medicine));
}

function encodeProduct(product){
return encodeURIComponent(JSON.stringify(product)).replace(/'/g, "%27");
}

function decodeProduct(encodedProduct){
return JSON.parse(decodeURIComponent(encodedProduct));
}

function normalizeLocation(location){
if(!location) return null;

const latitude = Number(location.latitude ?? location.lat ?? location.coordinates?.[1]);
const longitude = Number(location.longitude ?? location.lng ?? location.coordinates?.[0]);

if(!Number.isFinite(latitude) || !Number.isFinite(longitude)){
return null;
}

return { latitude, longitude };
}

function formatCategory(category){
return String(category || "General")
.replace(/_/g, " ")
.toLowerCase()
.replace(/\b\w/g, letter => letter.toUpperCase());
}

function formatCurrency(value){
return `Rs ${Number(value || 0).toLocaleString("en-IN")}`;
}

function escapeHtml(value){
return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#39;");
}

function normalizeText(value){
return String(value || "").toLowerCase().trim();
}

function resolveCategoryKey(value){
if(!value || value === "all") return "all";

const directKey = String(value || "").trim().toUpperCase();

if(CATEGORY_CONFIG[directKey]){
return directKey;
}

const normalizedValue = normalizeText(value);
const matchedEntry = Object.entries(CATEGORY_CONFIG).find(([, config]) =>
config.aliases.includes(normalizedValue) || normalizeText(config.label) === normalizedValue
);

return matchedEntry ? matchedEntry[0] : "all";
}

function getCategoryCodes(categoryKey){
return CATEGORY_CONFIG[categoryKey]?.codes || [];
}

function getCategoryLabel(categoryKey){
return CATEGORY_CONFIG[categoryKey]?.label || "All Categories";
}

function getCategoryQueryValue(categoryKey){
return CATEGORY_CONFIG[categoryKey]?.queryValue || "";
}

function matchesSelectedCategory(medicineCategory, categoryKey){
if(categoryKey === "all") return true;
return getCategoryCodes(categoryKey).includes(String(medicineCategory || "").toUpperCase());
}

function toRadians(value){
return value * (Math.PI / 180);
}

function calculateDistanceKm(from, to){
if(!from || !to) return null;

const earthRadius = 6371;
const dLat = toRadians(to.latitude - from.latitude);
const dLng = toRadians(to.longitude - from.longitude);

const a =
Math.sin(dLat / 2) * Math.sin(dLat / 2) +
Math.cos(toRadians(from.latitude)) *
Math.cos(toRadians(to.latitude)) *
Math.sin(dLng / 2) * Math.sin(dLng / 2);

const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
return earthRadius * c;
}

function getDistance(lat1, lon1, lat2, lon2){
const R = 6371;
const dLat = (lat2-lat1) * Math.PI/180;
const dLon = (lon2-lon1) * Math.PI/180;

const a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1 * Math.PI/180) *
Math.cos(lat2 * Math.PI/180) *
Math.sin(dLon/2) * Math.sin(dLon/2);

const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return (R * c).toFixed(3);
}

function getSellerDistance(medicine){
return calculateDistanceKm(
buyerLocation,
normalizeLocation(medicine.seller_details?.location || medicine.seller_details)
);
}

function getCurrentLocation(){
return new Promise((resolve, reject) => {
if(!navigator.geolocation){
reject(new Error("Location is not supported in this browser."));
return;
}

navigator.geolocation.getCurrentPosition(
position => resolve({
latitude: position.coords.latitude,
longitude: position.coords.longitude
}),
error => {
console.error(error);
if(error.code === error.PERMISSION_DENIED){
reject(new Error("Enable location access to search nearby pharmacies."));
return;
}

reject(new Error("Unable to fetch your location right now."));
},
{
enableHighAccuracy: false,
timeout: 10000,
maximumAge: 60000
}
);
});
}

function startSlider(card){
const images = JSON.parse(card.getAttribute("data-images"));
if(!images || images.length < 2) return;

const imgTag = card.querySelector(".product-img");
let index = 0;

const interval = setInterval(() => {
index = (index + 1) % images.length;
imgTag.src = "/uploads/" + images[index];
}, 1500);

sliderIntervals.set(card, interval);
}

function stopSlider(card){
const interval = sliderIntervals.get(card);

if(interval){
clearInterval(interval);
sliderIntervals.delete(card);
}

const imgTag = card.querySelector(".product-img");
const first = imgTag.getAttribute("data-first");

if(first){
imgTag.src = "/uploads/" + first;
}
}

: "Medicine Results",
activeCategoryFilter !== "all"

container.innerHTML += `

data-images='${imagesData}'

alt="${medicineName}">

pharmacy.shopName,
pharmacy.address,
pharmacy.city,
pharmacy.pincode,
pharmacy.email
].filter(Boolean).join(" ").toLowerCase();

return searchable.includes(search);
});

if(filtered.length === 0){
updateResultsHead("Nearby Pharmacies", "No pharmacies found.");
container.innerHTML = "<p>No pharmacies found.</p>";
return;
}

updateResultsHead(
"Nearby Pharmacies",
`${filtered.length} pharmacy(s) sorted by nearest distance`
);

container.innerHTML = filtered.map(pharmacy => {
const address = [
pharmacy.address,
pharmacy.city,
pharmacy.pincode
].filter(Boolean).join(", ");
const distanceLabel = pharmacy.distance
? pharmacy.distance
: Number.isFinite(Number(pharmacy.distanceKm))
  ? `${Number(pharmacy.distanceKm).toFixed(3)} km away`
: "Distance unavailable";
const actionMarkup = pharmacy.email
? `<button type="button" data-email="${escapeHtml(pharmacy.email || "")}" onclick="viewSellerMedicines(this.dataset.email)">View Products</button>`
: `<button type="button" disabled>View Products Unavailable</button>`;

const shopImageMarkup = pharmacy.shop_image
  ? `<div class="pharmacy-card-banner"><img src="${pharmacy.shop_image ? pharmacy.shop_image : 'placeholder-banner.png'}" alt="${escapeHtml(pharmacy.name || "Pharmacy")} shop" class="pharmacy-banner-img"></div>`
  : `<div class="pharmacy-card-banner pharmacy-card-banner--placeholder"><span class="pharmacy-banner-icon">🏪</span></div>`;

return `
<article class="pharmacy-card">
${shopImageMarkup}
<div class="pharmacy-card-top">
<div>
<p class="pharmacy-label">Nearby Pharmacy</p>
<h3>${escapeHtml(pharmacy.name || pharmacy.shopName || pharmacy.pharmacy_name || "Pharmacy")}</h3>
</div>
<span class="pharmacy-distance">${escapeHtml(distanceLabel)}</span>
</div>
<p class="pharmacy-address">${escapeHtml(address || "Address unavailable")}</p>
<div class="pharmacy-meta-row">
<span class="pharmacy-meta">${escapeHtml(String(pharmacy.medicineCount || 0))} product(s) available</span>
<span class="pharmacy-meta secondary-meta">${escapeHtml(pharmacy.city || "Location saved")}</span>
</div>
${actionMarkup}
</article>
`;
}).join("");
}

function addToCart(medicine){
if(!localStorage.getItem("buyer_email")){
alert("Login as buyer first");
window.location.href = "LOGINPAGE.HTML";
return;
}

const cart = JSON.parse(localStorage.getItem("cart")) || [];
const existing = cart.find(item =>
(medicine._id && item.medicine_id === medicine._id) ||
(!medicine._id && item.medicine_name === medicine.medicine_name)
);

if(existing){
existing.quantity += 1;
}
else{
cart.push({
medicine_id: medicine._id,
medicine_name: medicine.medicine_name,
seller_email: medicine.seller_email,
price: medicine.price,
image: medicine.images?.[0] || "default.png",
prescription_required: medicine.prescription_required || "No",
quantity: 1
});
}

localStorage.setItem("cart", JSON.stringify(cart));
window.refreshCartNavLabel();
alert("Added to cart");
}

}

function filterMedicines(){
const search = normalizeText(document.getElementById("searchInput").value);
const priceSortType = document.getElementById("priceSort").value;
const stockSortType = document.getElementById("stockSort").value;

let filtered = allMedicines.filter(medicine => {
const seller = medicine.seller_details || {};
const searchableText = [
medicine.medicine_name,
medicine.brand,
medicine.category,
seller.shopName,
seller.pharmacy_name,
seller.owner_name,
seller.city,
seller.address
].filter(Boolean).join(" ").toLowerCase();

return searchableText.includes(search) &&
matchesSelectedCategory(medicine.category, activeCategoryFilter) &&
(!activeSellerFilter || medicine.seller_email === activeSellerFilter);
});

if(priceSortType === "low") filtered.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0));
if(priceSortType === "high") filtered.sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0));
if(stockSortType === "stock-low") filtered.sort((a, b) => (Number(a.stock) || 0) - (Number(b.stock) || 0));
if(stockSortType === "stock-high") filtered.sort((a, b) => (Number(b.stock) || 0) - (Number(a.stock) || 0));
if(priceSortType === "near"){
filtered.sort((a, b) => {
const distanceA = getSellerDistance(a);
const distanceB = getSellerDistance(b);

if(distanceA === null && distanceB === null) return 0;
if(distanceA === null) return 1;
if(distanceB === null) return -1;
return distanceA - distanceB;
});
}

displayMedicines(filtered);
}

async function handleCategoryChange(){
activeCategoryFilter = document.getElementById("categoryFilter").value;
currentSearchMode = "medicines";
localStorage.setItem("listingSearchMode", "medicines");
updateSearchUi();
await loadMedicines();
}

async function fetchNearbyPharmacies(forceRefresh = false){
try{
if(!buyerLocation || forceRefresh){
setLocationStatus("Fetching your current location...", "info", true);
buyerLocation = await getCurrentLocation();
saveBuyerLocation(buyerLocation);
}

setLocationStatus("Finding the nearest pharmacies near you...", "info", true);
const searchTerm = document.getElementById("searchInput").value.trim();
const result = await window.fetchJson(
`${BASE_URL}/api/get-pharmacies${searchTerm ? `?search=${encodeURIComponent(searchTerm)}` : ""}`,
{},
"Server error or invalid response"
);

const pharmacies = Array.isArray(result.pharmacies) ? result.pharmacies : [];
nearbyPharmacies = pharmacies
.map(pharmacy => {
const location = normalizeLocation(pharmacy);

if(!location){
return null;
}

const distanceKm = Number(
getDistance(
buyerLocation.latitude,
buyerLocation.longitude,
location.latitude,
location.longitude
)
);

if(!Number.isFinite(distanceKm)){
return null;
}

return {
...pharmacy,
distanceKm,
  distance: `${distanceKm.toFixed(3)} km away`
};
})
.filter(Boolean)
.filter(pharmacy => pharmacy.distanceKm <= PHARMACY_SEARCH_RANGE_KM)
.sort((first, second) => first.distanceKm - second.distanceKm);

currentSearchMode = "pharmacies";
localStorage.setItem("listingSearchMode", "pharmacies");
updateSearchUi();
renderPharmacyResults();

setLocationStatus(
nearbyPharmacies.length
? `Showing ${nearbyPharmacies.length} pharmacy(s) sorted by nearest distance.`
: "No pharmacies found.",
nearbyPharmacies.length ? "success" : "info",
false
);
}
catch(error){
console.error(error);
if(
error.message === "Enable location access to search nearby pharmacies." ||
error.message === "Location is not supported in this browser." ||
error.message === "Unable to fetch your location right now."
){
setLocationStatus(error.message, "error", false);
showEmptyState(error.message);
return;
}

setLocationStatus(window.getApiErrorMessage(error), "error", false);
showEmptyState(window.getApiErrorMessage(error));
}
}

function handleSearchModeChange(){
currentSearchMode = document.getElementById("searchMode").value;
localStorage.setItem("listingSearchMode", currentSearchMode);

if(currentSearchMode === "pharmacies"){
activeSellerFilter = "";
localStorage.setItem("homepagePharmacySearchTerm", document.getElementById("searchInput").value.trim());
}
else{
localStorage.removeItem("homepagePharmacySearchTerm");
}

updateSearchUi();

if(currentSearchMode === "pharmacies"){
if(nearbyPharmacies.length > 0){
renderPharmacyResults();
}
else{
showEmptyState("Use search, or open the home page once while signed in so we can use your saved location.");
}
return;
}

filterMedicines();
}

function handleSearchInput(){
if(currentSearchMode === "pharmacies"){
localStorage.setItem("homepagePharmacySearchTerm", document.getElementById("searchInput").value.trim());
renderPharmacyResults();
return;
}

filterMedicines();
}

function handleSearchKeydown(event){
if(event.key === "Enter"){
event.preventDefault();
runSearch();
}
}

function runSearch(){
if(currentSearchMode === "pharmacies"){
fetchNearbyPharmacies(false);
return;
}

localStorage.setItem("listingSearchMode", "medicines");
filterMedicines();
}

function clearSellerFilter(){
activeSellerFilter = "";
currentSearchMode = "medicines";
document.getElementById("searchMode").value = "medicines";
updateSearchUi();
filterMedicines();
}

function viewSellerMedicines(email){
if(!email) return;

localStorage.setItem("listingSearchMode", "medicines");
localStorage.removeItem("homepagePharmacySearchTerm");
window.location.href = `LISTINGPAGE.HTML?seller=${encodeURIComponent(email)}`;
}

function applyInitialSearchState(){
activeSellerFilter = initialUrlParams.get("seller") || "";
activeCategoryFilter = resolveCategoryKey(initialUrlParams.get("category"));

if(activeSellerFilter){
currentSearchMode = "medicines";
}
else if(initialUrlParams.get("mode") === "pharmacies" || localStorage.getItem("listingSearchMode") === "pharmacies"){
currentSearchMode = "pharmacies";
}
else{
currentSearchMode = "medicines";
}

document.getElementById("searchMode").value = currentSearchMode;
document.getElementById("categoryFilter").value = activeCategoryFilter;

if(currentSearchMode === "pharmacies"){
document.getElementById("searchInput").value = localStorage.getItem("homepagePharmacySearchTerm") || "";
}
else{
document.getElementById("searchInput").value = localStorage.getItem("homepageSearchTerm") || "";
localStorage.removeItem("homepageSearchTerm");
}

updateSearchUi();
}

async function loadMedicines(){
try{
const categoryQuery = activeCategoryFilter !== "all"
? `?category=${encodeURIComponent(getCategoryQueryValue(activeCategoryFilter))}`
: "";
const data = await window.fetchJson(
`${BASE_URL}/api/medicines${categoryQuery}`,
{},
"Server error or invalid response"
);
allMedicines = Array.isArray(data) ? data : (Array.isArray(data?.medicines) ? data.medicines : []);
console.log('loadMedicines: loaded', allMedicines.length, 'medicines');

if(currentSearchMode === "pharmacies"){
if(buyerLocation){
await fetchNearbyPharmacies(false);
}
else{
showEmptyState("Enable location access to search nearby pharmacies.");
}
return;
}

filterMedicines();
}
catch(error){
console.log(error);
setLocationStatus(window.getApiErrorMessage(error), "error", false);
showEmptyState("Server error or invalid response");
}
}

loadNavbar();
applyInitialSearchState();
hydrateBuyerLocationFromStorage();

(async function initListing(){
if(buyerEmail){
await window.syncMedDeliverDeviceLocation();
hydrateBuyerLocationFromStorage();
}
await loadMedicines();
})();
</script>
