<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Delivery | ADM Pharmacy</title>
<style>
body{margin:0;font-family:Segoe UI,Tahoma,Verdana,sans-serif;background:#f4f7fb;color:#102033;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px;}
.container{max-width:420px;width:100%;background:#ffffff;border-radius:20px;box-shadow:0 18px 42px rgba(16,32,51,0.08);padding:28px;}
</style>
    <link rel="stylesheet" href="logo-styles.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="container">
<h1>Redirecting to tracker...</h1>
<p>If the page does not redirect automatically, please use the button below.</p>
<p id="fallback"></p>
<button id="goBtn" style="padding:12px 18px;border:none;border-radius:12px;background:#0077b6;color:#fff;font-weight:700;cursor:pointer;">Go to Tracking</button>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const orderId = params.get('orderId');
const target = orderId ? `TRACKORDER.HTML?order_id=${encodeURIComponent(orderId)}` : 'ORDERS.HTML';
const goBtn = document.getElementById('goBtn');
if(orderId){
    goBtn.textContent = 'Open Tracking Page';
    goBtn.onclick = () => window.location.href = target;
    window.location.replace(target);
} else {
    document.getElementById('fallback').textContent = 'Order ID is missing from the URL.';
    goBtn.textContent = 'Go Back';
    goBtn.onclick = () => window.location.href = 'ORDERS.HTML';
}
</script>
</body>
</html>
